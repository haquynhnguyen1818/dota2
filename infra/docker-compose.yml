services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: disable
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      # Unused by the API itself; needed by `docker compose run api
      # python -m app.jobs.refresh_weekly`, which reuses this service.
      STRATZ_TOKEN: ${STRATZ_TOKEN}
    ports:
      - "8000:8000"

volumes:
  pgdata:
