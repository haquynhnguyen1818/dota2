[project]
name = "dota2"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary,pool]",
    "requests",
    "fastapi",
    "uvicorn[standard]",
    "streamlit",
    "anthropic",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
